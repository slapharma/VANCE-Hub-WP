name: Deploy theme to vancehealthhub.co.uk

# Auto-deploys the WordPress theme to the live Hostinger site on every push to
# main that touches the theme. A manual "Run workflow" button is also exposed
# for re-deploys / deploying from another branch.
on:
  push:
    branches: [main]
    paths:
      - 'wp-content/themes/sla-health-hub/**'
      - 'wp-content/plugins/vhh-annotations/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# Never let two deploys overlap onto the live site; cancel-in-progress is off so
# an in-flight deploy always finishes cleanly rather than being interrupted.
concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  SSH_HOST: 82.29.185.3
  SSH_PORT: '65002'
  SSH_USER: u767439438
  # Server-side path was renamed from domains/gastrohealthhub.com/ to
  # domains/vancehealthhub.co.uk/ during the 2026-04 rebrand. Earlier versions
  # of this workflow still referenced the old name; see RECONCILIATION-2026-05-25
  # for the incident this fix addresses.
  REMOTE_THEME: domains/vancehealthhub.co.uk/public_html/wp-content/themes/sla-health-hub
  LOCAL_THEME: wp-content/themes/sla-health-hub
  REMOTE_PLUGIN: domains/vancehealthhub.co.uk/public_html/wp-content/plugins/vhh-annotations
  LOCAL_PLUGIN: wp-content/plugins/vhh-annotations

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify deploy secret is configured
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "::error::Repository secret HOSTINGER_SSH_KEY is not set. Add the Hostinger private key under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hostinger_sla
          chmod 600 ~/.ssh/hostinger_sla
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 644 ~/.ssh/known_hosts

      - name: Verify remote theme path exists
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/hostinger_sla -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "test -d ~/$REMOTE_THEME && echo 'REMOTE_THEME_OK' || (echo '::error::Remote theme dir ~/$REMOTE_THEME not found on server' && exit 1)"

      # 2026-08-10 incident: this step failed twice in one day with "file
      # changed as we read it" followed by a broken-pipe "Child returned
      # status 141". Two independent races were stacked here, both fixed
      # below:
      #
      # 1. The LOCAL side used to `tar czf - --exclude=... .` over the live
      #    checked-out working tree. `git archive HEAD:path` reads committed
      #    blobs from the object database instead of stat()-ing live files,
      #    so there is nothing to race. It also only ever includes tracked
      #    files, which is why the old --exclude list (all of it untracked
      #    cruft — rebrand scripts, .bak files, screenshots) is gone rather
      #    than ported over: it's redundant now.
      # 2. The REMOTE side's pre-deploy backup tar snapshots the live theme
      #    dir while WordPress is still serving it, so a page load writing a
      #    cache file mid-tar is expected, not exceptional. GNU tar's exit
      #    codes distinguish the two: 1 = "some files differ" (this case —
      #    harmless), 2 = a real fatal error. Without the "|| [ $? -eq 1 ]"
      #    tolerance below, `set -e` treated exit 1 the same as exit 2 and
      #    aborted the remote script before it ever reached `tar xzf -` —
      #    which closed this SSH session's stdin mid-stream and is what
      #    produced the broken-pipe error on the sending side.
      - name: Deploy theme (backup-then-extract)
        run: |
          set -euo pipefail
          TSTAMP=$(date +%Y-%m-%d-%H%M)
          git archive --format=tar "HEAD:$LOCAL_THEME" | gzip | \
          ssh -i ~/.ssh/hostinger_sla -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "set -e; \
             THEME=~/$REMOTE_THEME; \
             cd \"\$THEME/..\" && ls -1t sla-health-hub-pre-deploy-*.tar.gz 2>/dev/null | tail -n +3 | xargs -r rm -f; \
             cd \"\$THEME\" && \
             { tar czf \"\$THEME/../sla-health-hub-pre-deploy-${TSTAMP}.tar.gz\" . || [ \$? -eq 1 ]; } && \
             tar xzf - && \
             echo 'DEPLOY_OK'"

      # The plugin dir may not exist yet on first deploy, so this step creates
      # it (mkdir -p) instead of reusing the theme step's test -d guard. The
      # backup rotation mirrors the theme step with its own file prefix.
      # hashFiles guard: skip (don't fail) on refs that predate the plugin —
      # e.g. a workflow_dispatch rollback of an older commit.
      - name: Deploy vhh-annotations plugin (backup-then-extract)
        if: ${{ hashFiles('wp-content/plugins/vhh-annotations/vhh-annotations.php') != '' }}
        run: |
          set -euo pipefail
          TSTAMP=$(date +%Y-%m-%d-%H%M)
          git archive --format=tar "HEAD:$LOCAL_PLUGIN" | gzip | \
          ssh -i ~/.ssh/hostinger_sla -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "set -e; \
             PLUGIN=~/$REMOTE_PLUGIN; \
             mkdir -p \"\$PLUGIN\"; \
             cd \"\$PLUGIN/..\" && ls -1t vhh-annotations-pre-deploy-*.tar.gz 2>/dev/null | tail -n +3 | xargs -r rm -f; \
             cd \"\$PLUGIN\" && \
             if [ -f vhh-annotations.php ]; then { tar czf \"\$PLUGIN/../vhh-annotations-pre-deploy-${TSTAMP}.tar.gz\" . || [ \$? -eq 1 ]; }; fi && \
             tar xzf - && \
             echo 'PLUGIN_DEPLOY_OK'"

      - name: Post-deploy reminder
        if: success()
        run: |
          echo "### Deploy complete :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Site: https://vancehealthhub.co.uk" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "A pre-deploy backup was written on the server as \`sla-health-hub-pre-deploy-*.tar.gz\` (one level above the theme dir)." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Manual follow-ups (no CLI hook available):**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Purge Hostinger cache: hPanel → Cache Manager → Purge All" >> "$GITHUB_STEP_SUMMARY"
          echo "- Purge LiteSpeed plugin cache (if installed)" >> "$GITHUB_STEP_SUMMARY"
          echo "- If CSS changed, bump the \`wp_enqueue_style\` version in \`functions.php\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Run the smoke tests listed in CLAUDE.md" >> "$GITHUB_STEP_SUMMARY"
          echo "- First plugin deploy only: activate over SSH with \`wp plugin activate vhh-annotations\` (run from the site's public_html)" >> "$GITHUB_STEP_SUMMARY"
