name: Deploy theme to vancehealthhub.co.uk

# Auto-deploys the WordPress theme to the live Hostinger site on every push to
# main that touches the theme. A manual "Run workflow" button is also exposed
# for re-deploys / deploying from another branch.
on:
  push:
    branches: [main]
    paths:
      - 'wp-content/themes/vance-health-hub/**'
      - 'wp-content/plugins/vhh-annotations/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# Never let two deploys overlap onto the live site; cancel-in-progress is off so
# an in-flight deploy always finishes cleanly rather than being interrupted.
concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  SSH_HOST: 82.29.185.3
  SSH_PORT: '65002'
  SSH_USER: u767439438
  # Server-side path was renamed from domains/gastrohealthhub.com/ to
  # domains/vancehealthhub.co.uk/ during the 2026-04 rebrand. Earlier versions
  # of this workflow still referenced the old name; see RECONCILIATION-2026-05-25
  # for the incident this fix addresses.
  # Site root. The cache purge runs wp-cli from here, not from the theme dir.
  REMOTE_SITE: domains/vancehealthhub.co.uk/public_html
  REMOTE_THEME: domains/vancehealthhub.co.uk/public_html/wp-content/themes/vance-health-hub
  LOCAL_THEME: wp-content/themes/vance-health-hub
  REMOTE_PLUGIN: domains/vancehealthhub.co.uk/public_html/wp-content/plugins/vhh-annotations
  LOCAL_PLUGIN: wp-content/plugins/vhh-annotations

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify deploy secret is configured
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "::error::Repository secret HOSTINGER_SSH_KEY is not set. Add the Hostinger private key under Settings → Secrets and variables → Actions."
            exit 1
          fi

      # The host keys are PINNED here rather than fetched with `ssh-keyscan`.
      #
      # History. 2026-08-21 (run 32476704759): a keyscan blip failed the deploy
      # with a bare exit 1. That was fixed by retrying five times with backoff.
      # 2026-08-28: the retries were not enough — two consecutive deploys
      # (9051211, e2c5dc8) burned all five attempts over ~2 minutes each and
      # failed, while plain SSH to the same host from a workstation succeeded
      # throughout. So Hostinger is intermittently refusing the runner's
      # outbound probe on 65002, not going down.
      #
      # Pinning removes the network call entirely. It is also strictly SAFER
      # than a keyscan: a keyscan trusts whatever answers on the port at deploy
      # time, which is trust-on-first-use repeated on every run — it would have
      # happily pinned an impostor. These three keys are a fixed value in
      # version control, reviewable in a diff.
      #
      # Captured 2026-08-28 and cross-checked two ways before being committed:
      # a fresh `ssh-keyscan -p 65002 82.29.185.3`, and the local known_hosts
      # entry that every successful `BatchMode=yes` connection had already been
      # verifying against. Both agreed on all three keys.
      #
      #   ED25519  SHA256:uYewCMfDcHJBLw+c6WpKvXyBZNH5XJbC7MyQW+53NdA
      #   ECDSA    SHA256:j6rY+cratr8viDkFhiqWCCZWksaXxjyQag975s5JO1M
      #   RSA      SHA256:FmsWcq/3D307ZZbbNT0RTmRvji6gI6AVhMk3CfY+rNE
      #
      # IF THE DEPLOY EVER FAILS WITH "Host key verification failed", do not
      # paste in a new key to make it go away — that is the one message this
      # pin exists to produce. Either Hostinger rebuilt/migrated the server, or
      # something is answering on that port that should not be. Confirm the new
      # fingerprints out of band (hPanel, or an SSH session you already trust),
      # then update the three lines and the fingerprints above in one commit.
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hostinger_sla
          chmod 600 ~/.ssh/hostinger_sla

          # printf, not a heredoc: a heredoc body has to sit at column 0, and a
          # line at column 0 ends the YAML block scalar this step is written in
          # — the file stops parsing and the workflow never runs. Quoted printf
          # arguments can be indented with the rest of the step.
          printf '%s\n' \
            '[82.29.185.3]:65002 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFgHS5aTxSUNmvNPyI6jyI3mxQ3aeFZTnvSs7F61jXng' \
            '[82.29.185.3]:65002 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBN3NRrdEdKneGSG55VCpK5HT1jk9lyaVXWVXJa+j5p3PacssQo7cf3bq2uMAAcq58gfBSrGAs7QS5M4OsTAJwtE=' \
            '[82.29.185.3]:65002 ssh-rsa ' \
            > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          # Make the pin binding for every ssh in this job without having to
          # repeat -o flags on each of the four call sites. `yes`, not the
          # default `ask`: on a runner there is no tty, so `ask` degrades to an
          # error anyway, but saying it outright means the intent survives
          # somebody later running this interactively.
          printf '%s\n' \
            'Host *' \
            '    StrictHostKeyChecking yes' \
            '    UserKnownHostsFile ~/.ssh/known_hosts' \
            > ~/.ssh/config
          chmod 600 ~/.ssh/config

          # A heredoc that lost its terminator, or an edit that dropped a line,
          # would otherwise surface later as a confusing auth failure.
          keys=$(ssh-keygen -lf ~/.ssh/known_hosts | wc -l)
          if [ "$keys" -ne 3 ]; then
            echo "::error::Pinned known_hosts should hold 3 host keys, found ${keys}. The printf block in this step is malformed."
            exit 1
          fi
          echo "Pinned ${keys} host keys for ${SSH_HOST}:${SSH_PORT} (no network call):"
          ssh-keygen -lf ~/.ssh/known_hosts

      - name: Verify remote theme path exists
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/hostinger_sla -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "test -d ~/$REMOTE_THEME && echo 'REMOTE_THEME_OK' || (echo '::error::Remote theme dir ~/$REMOTE_THEME not found on server' && exit 1)"

      # 2026-08-10 incident: this step failed twice in one day with "file
      # changed as we read it" followed by a broken-pipe "Child returned
      # status 141". Two independent races were stacked here, both fixed
      # below:
      #
      # 1. The LOCAL side used to `tar czf - --exclude=... .` over the live
      #    checked-out working tree. `git archive HEAD:path` reads committed
      #    blobs from the object database instead of stat()-ing live files,
      #    so there is nothing to race. It also only ever includes tracked
      #    files, which is why the old --exclude list (all of it untracked
      #    cruft — rebrand scripts, .bak files, screenshots) is gone rather
      #    than ported over: it's redundant now.
      # 2. The REMOTE side's pre-deploy backup tar snapshots the live theme
      #    dir while WordPress is still serving it, so a page load writing a
      #    cache file mid-tar is expected, not exceptional. GNU tar's exit
      #    codes distinguish the two: 1 = "some files differ" (this case —
      #    harmless), 2 = a real fatal error. Without the "|| [ $? -eq 1 ]"
      #    tolerance below, `set -e` treated exit 1 the same as exit 2 and
      #    aborted the remote script before it ever reached `tar xzf -` —
      #    which closed this SSH session's stdin mid-stream and is what
      #    produced the broken-pipe error on the sending side.
      - name: Deploy theme (backup-then-extract)
        run: |
          set -euo pipefail
          TSTAMP=$(date +%Y-%m-%d-%H%M)
          git archive --format=tar "HEAD:$LOCAL_THEME" | gzip | \
          ssh -i ~/.ssh/hostinger_sla -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "set -e; \
             THEME=~/$REMOTE_THEME; \
             cd \"\$THEME/..\" && ls -1t vance-health-hub-pre-deploy-*.tar.gz 2>/dev/null | tail -n +3 | xargs -r rm -f; \
             cd \"\$THEME\" && \
             { tar czf \"\$THEME/../vance-health-hub-pre-deploy-${TSTAMP}.tar.gz\" . || [ \$? -eq 1 ]; } && \
             tar xzf - && \
             echo 'DEPLOY_OK'"

      # The plugin dir may not exist yet on first deploy, so this step creates
      # it (mkdir -p) instead of reusing the theme step's test -d guard. The
      # backup rotation mirrors the theme step with its own file prefix.
      # hashFiles guard: skip (don't fail) on refs that predate the plugin —
      # e.g. a workflow_dispatch rollback of an older commit.
      - name: Deploy vhh-annotations plugin (backup-then-extract)
        if: ${{ hashFiles('wp-content/plugins/vhh-annotations/vhh-annotations.php') != '' }}
        run: |
          set -euo pipefail
          TSTAMP=$(date +%Y-%m-%d-%H%M)
          git archive --format=tar "HEAD:$LOCAL_PLUGIN" | gzip | \
          ssh -i ~/.ssh/hostinger_sla -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "set -e; \
             PLUGIN=~/$REMOTE_PLUGIN; \
             mkdir -p \"\$PLUGIN\"; \
             cd \"\$PLUGIN/..\" && ls -1t vhh-annotations-pre-deploy-*.tar.gz 2>/dev/null | tail -n +3 | xargs -r rm -f; \
             cd \"\$PLUGIN\" && \
             if [ -f vhh-annotations.php ]; then { tar czf \"\$PLUGIN/../vhh-annotations-pre-deploy-${TSTAMP}.tar.gz\" . || [ \$? -eq 1 ]; }; fi && \
             tar xzf - && \
             echo 'PLUGIN_DEPLOY_OK'"

      # Without this, a green deploy did NOT mean a changed site. LiteSpeed
      # keeps serving the previous HTML until something purges it, so the new
      # files sit on disk behind a stale page cache. Observed on 2026-08-26:
      # the homepage still rendered the old hero (x-litespeed-cache: hit,
      # Age 21) while a cache-busted request already showed the new one.
      #
      # This step warns rather than fails, deliberately. If the purge cannot
      # run, the deploy itself still succeeded and the code IS live — failing
      # the run would misreport that. But it must not pass silently either, so
      # it asserts on LiteSpeed's own "Purged All" acknowledgement and warns
      # when the plugin is active and that string does not come back.
      #
      # Jetpack Boost is not purged, and does not need to be: it exposes no
      # purge subcommand, and its only cache here is wp-content/boost-cache/
      # static/, whose filenames are content hashes — changed CSS produces a
      # new filename on its own. Confirmed after the 2026-08-26 deploy.
      #
      # The remote script is one double-quoted multi-line argument rather than
      # backslash-continued lines: $REMOTE_SITE still interpolates locally, the
      # single quotes inside stay literal, and it survives editing.
      - name: Purge caches
        if: success()
        run: |
          set -uo pipefail
          ssh -i ~/.ssh/hostinger_sla -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
            set -u
            cd ~/$REMOTE_SITE 2>/dev/null || { echo 'PURGE_SKIP: site dir ~/$REMOTE_SITE not found'; exit 0; }
            command -v wp >/dev/null 2>&1 || { echo 'PURGE_SKIP: wp-cli not on PATH'; exit 0; }
            wp cache flush 2>&1 | sed 's/^/object-cache: /' || true
            if wp plugin is-active litespeed-cache >/dev/null 2>&1; then
              wp litespeed-purge all 2>&1 | sed 's/^/litespeed: /' || true
            else
              echo 'litespeed: plugin inactive, nothing to purge'
            fi
          " | tee /tmp/purge.out

          if grep -q 'PURGE_SKIP' /tmp/purge.out; then
            echo "::warning::Cache purge skipped — $(grep -m1 'PURGE_SKIP' /tmp/purge.out). The deploy landed, but the site may serve stale HTML until a cache is purged by hand."
          elif grep -q 'plugin inactive' /tmp/purge.out; then
            echo "::notice::LiteSpeed plugin is inactive; only the object cache was flushed."
          elif ! grep -qi 'Purged All' /tmp/purge.out; then
            echo "::warning::LiteSpeed is active but did not acknowledge the purge (no 'Purged All' in its output). The site may still be serving the previous HTML — purge by hand via hPanel → Cache Manager → Purge All."
          else
            echo "Caches purged."
          fi

      - name: Post-deploy reminder
        if: success()
        run: |
          echo "### Deploy complete :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Site: https://vancehealthhub.co.uk" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "A pre-deploy backup was written on the server as \`vance-health-hub-pre-deploy-*.tar.gz\` (one level above the theme dir)." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The object cache and the LiteSpeed page cache are purged by the **Purge caches** step — read that step for a warning before assuming a change is visible." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Manual follow-ups:**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Only if the Purge caches step warned: hPanel → Cache Manager → Purge All" >> "$GITHUB_STEP_SUMMARY"
          echo "- If CSS changed, bump the \`wp_enqueue_style\` version in \`functions.php\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Run the smoke tests listed in CLAUDE.md" >> "$GITHUB_STEP_SUMMARY"
          echo "- First plugin deploy only: activate over SSH with \`wp plugin activate vhh-annotations\` (run from the site's public_html)" >> "$GITHUB_STEP_SUMMARY"
